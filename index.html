<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing iframes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      .status {
        padding: 8px 12px;
        font-size: 13px;
        background: white;
        border-bottom: 1px solid #e5e7eb;
      }

      .status.loading {
        color: #666;
      }

      .status.ready {
        color: #059669;
        font-weight: 500;
      }

      .status.error {
        color: #dc2626;
      }

      iframe {
        display: block;
        width: 100%;
        flex: 1;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="status loading" id="status">Cargando...</div>
    <iframe id="frame" style="display: none"></iframe>

    <script>
      const CONFIG = {
        endpoint: "https://sb-mw.migopayments.com/transactions",
        token:
          "0674a08d361c7262b3c6a93a100d5bc5f70fb5eb53597e5dcc04bcee542cf1fd",
      };

      function generateUserId() {
        const random5Digits = Math.floor(Math.random() * 100000)
          .toString()
          .padStart(5, "0");
        return "502" + random5Digits;
      }

      async function init() {
        const statusEl = document.getElementById("status");
        const frame = document.getElementById("frame");

        try {
          const userId = generateUserId().toString();

          const response = await fetch(CONFIG.endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: CONFIG.token,
            },
            body: JSON.stringify({
              amount: 100,
              userId: userId,
              channel: "app",
              client: "quantoGT",
              ads: [],
            }),
          });

          if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          if (!data.URL) {
            throw new Error("No se recibió URL en la respuesta");
          }

          frame.src = data.URL;

          statusEl.textContent = `✓ Listo - Reference: ${data.reference}`;
          statusEl.className = "status ready";
          frame.style.display = "block";
        } catch (error) {
          statusEl.textContent = `✗ Error: ${error.message}`;
          statusEl.className = "status error";
          console.error("Error:", error);
        }
      }

      init();
    </script>
  </body>
</html>
